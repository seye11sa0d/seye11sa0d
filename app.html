<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seye11sa0d</title>
<meta name="theme-color" content="#1b2230">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seye11sa0d">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; background: #1b2230; }
  body {
    position: fixed; inset: 0; box-sizing: border-box;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    font-family: system-ui, Tahoma, sans-serif; color: #e8edf7;
  }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  #state {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #1b2230; text-align: center; padding: 24px;
  }
  #state[hidden] { display: none; }
  #msg { font-size: 17px; }
  #actions { display: flex; gap: 10px; }
  #actions[hidden] { display: none; }
  button, a.btn {
    font: inherit; font-size: 15px; padding: 10px 18px; border-radius: 10px;
    border: 1px solid #4cc9b0; background: transparent; color: #e8edf7;
    text-decoration: none; cursor: pointer;
  }
  button:focus-visible, a.btn:focus-visible { outline: 2px solid #4cc9b0; outline-offset: 2px; }
</style>
</head>
<body>
<iframe id="site" title="Seye11sa0d" allow="fullscreen; clipboard-write"></iframe>
<div id="state">
  <div id="msg">در حال باز کردن سایت…</div>
  <div id="actions" hidden>
    <button id="retry" type="button">تلاش دوباره</button>
    <a class="btn" id="browser" target="_blank" rel="noopener">باز کردن در مرورگر</a>
  </div>
</div>
<script>
  // Address of the site this app opens. Change it here if the site moves.
  var SITE_URL = "https://seye11sa0d.github.io/seye11sa0d/";

  var frame = document.getElementById("site");
  var state = document.getElementById("state");
  var msg = document.getElementById("msg");
  var actions = document.getElementById("actions");
  var timer;

  document.getElementById("browser").href = SITE_URL;

  function load() {
    actions.hidden = true;
    state.hidden = false;
    if (!navigator.onLine) { fail("اینترنت وصل نیست."); return; }
    msg.textContent = "در حال باز کردن سایت…";
    clearTimeout(timer);
    timer = setTimeout(function () { fail("سایت باز نشد."); }, 12000);
    frame.src = SITE_URL;
  }
  function fail(text) {
    clearTimeout(timer);
    msg.textContent = text;
    actions.hidden = false;
  }

  frame.addEventListener("load", function () {
    if (frame.getAttribute("src")) { clearTimeout(timer); state.hidden = true; }
  });
  document.getElementById("retry").addEventListener("click", load);
  window.addEventListener("online", load);

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
  load();
</script>
</body>
</html>
