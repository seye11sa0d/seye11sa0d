  [46,"شیمی معدنی","تناوب","جدول تناوبی","حفظ کردن جدول تناوبی","todo","دوره ی آخر فلزات واسط لازم نیست",false],
  [47,"شیمی تجزیه","رسوب","ابرکلاس","دیدن فیلم های رسوب(فعالیت لازم نیست) فهمیدن موازنه جرم رسوب و تاثیر اسید و باز روی رسوب","todo","https://abarkelas.ir/packages/%D8%AA%D8%AC%D8%B2%DB%8C%D9%87%20(%D8%B1%D8%B3%D9%88%D8%A8%20%D9%88%20%D9%81%D8%B9%D8%A7%D9%84%DB%8C%D8%AA)%20-%20%D8%A7%D9%84%D9%85%D9%BE%DB%8C%D8%A7%D8%AF%20%D8%B4%DB%8C%D9%85%DB%8C/890",false]

const initialTasks = sourceRows.map(r => ({

  b: r[3],
  t: r[4],
  s: r[5],
  d: r[6],

}));

const RB=(initialTasks.find(t=>t.review)||{}).b||'مرور نکته\u200cها، فرمول\u200cها و حفظ';
const $=id=>document.getElementById(id);
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(a[k]===false||a[k]==null)continue;e.setAttribute(k,a[k]===true?'':a[k])}c.flat().forEach(x=>{if(x==null||x===false)return;e.append(x.nodeType?x:document.createTextNode(x))});return e};
const fa=n=>Number(n).toLocaleString('fa-IR');
const str=x=>typeof x==='string';
const ok=t=>!!t&&Number.isInteger(t.id)&&BR.includes(t.c)&&[t.m,t.b,t.t].every(x=>str(x)&&x.trim())&&str(t.d)&&typeof t.review==='boolean'&&(t.review?(t.s==='todo'||t.s==='done')&&!t.d:Object.hasOwn(SL,t.s));
const stOK=(t,s)=>Object.hasOwn(SL,s)&&(!t.review||s==='todo'||s==='done');

let tasks=initialTasks.map(t=>({...t})),filter='all',editing=null,pend=null,lastFocus=null,mt;
const open=new Set();
const tree=$('tree');
const GH={owner:'seye11sa0d',repo:'seye11sa0d',path:'data/progress.json',branch:null,sha:null};
let ghToken='',weekly=false,saveQueue=Promise.resolve(),serverReady=false,serverHasData=false;

function ghHeaders(json=false){
  const h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(ghToken)h.Authorization='Bearer '+ghToken;
  if(json)h['Content-Type']='application/json';
  return h;
}
async function ghFetch(url,options={}){
  const r=await fetch(url,{...options,headers:{...ghHeaders(!!options.body),...(options.headers||{})},cache:'no-store'});
  let data={};try{data=await r.json()}catch(_){}
  if(!r.ok){const e=new Error(data.message||('GitHub API: HTTP '+r.status));e.status=r.status;throw e;}
  return data;
}
function decodeBase64Utf8(s){
  const binary=atob(s.replace(/\\n/g,''));
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}
function encodeBase64Utf8(s){
  const bytes=new TextEncoder().encode(s);
  let binary='';
  for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
  return btoa(binary);
}
async function loadFromGitHub(){
  const repo=await ghFetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}`);
  GH.branch=repo.default_branch;
  try{
    const file=await ghFetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}?ref=${encodeURIComponent(GH.branch)}`);
    if(file.type!=='file'||!file.content)throw new Error('ساختار فایل داده معتبر نیست.');
    const data=JSON.parse(decodeBase64Utf8(file.content));
    if(!data||!Array.isArray(data.tasks)||!data.tasks.every(ok)||
       new Set(data.tasks.map(t=>t.id)).size!==data.tasks.length||
       typeof data.weekly!=='boolean')throw new Error('محتوای progress.json معتبر نیست.');
    tasks=data.tasks;weekly=data.weekly;GH.sha=file.sha;serverHasData=true;
  }catch(e){
    if(e.status===404){GH.sha=null;serverHasData=false;return;}
    throw e;
  }
}
async function saveToGitHub(){
  if(!serverReady)return false;
  if(!ghToken){msg('برای ذخیره در GitHub، توکن را وارد و دکمه «اتصال و ذخیره» را بزن.',1);return false;}
  const body={
    message:'Update CAPP study progress',
    content:encodeBase64Utf8(JSON.stringify({tasks,weekly},null,2)),
    branch:GH.branch
  };
  if(GH.sha)body.sha=GH.sha;
  const result=await ghFetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`,{
    method:'PUT',body:JSON.stringify(body)
  });
  GH.sha=result.content&&result.content.sha?result.content.sha:GH.sha;
  serverHasData=true;
  $('ghstate').textContent='ذخیره‌شده در GitHub';
  msg('اطلاعات در Repository گیت‌هاب ذخیره شد.');
  return true;
}
function save(){
  saveQueue=saveQueue.then(()=>saveToGitHub()).catch(e=>{
    const conflict=e.status===409||e.status===422;
    $('ghstate').textContent=conflict?'تعارض نسخه؛ صفحه را تازه‌سازی کن':'خطا در ذخیره GitHub';
    msg(conflict?'فایل در GitHub تغییر کرده است؛ صفحه را تازه‌سازی کن و دوباره تغییر بده.':('ذخیره در GitHub ناموفق بود: '+e.message),1);
    return false;
  });
  return saveQueue;
}

    h('label',{class:'fl'},'عنوان',h('input',{name:'t',value:t.t})),
    h('label',{class:'fl'},'وضعیت',h('select',{name:'s'},o.map(v=>h('option',{value:v,selected:v===t.s},SL[v])))),
    t.review?null:h('label',{class:'fl w'},'توضیحات',h('textarea',{name:'d',rows:2},t.d)),
    h('div',{class:'ac'},h('button',{class:'bt p',type:'submit'},'ذخیره'),h('button',{class:'bt',type:'button','data-a':'cancel'},'لغو')));
}
function taskRow(t){
  if(editing===t.id)return editRow(t);
  return h('div',{class:'task'},
    h('div',{class:'tm'},h('span',{class:'bd s-'+t.s},SL[t.s]),t.review?h('span',{class:'bd rvb'},'مرور'):null,h('span',{class:'tt'},t.t)),
    h('div',{class:'ac'},
      h('button',{class:'bt',type:'button','data-a':'edit','data-id':t.id,'aria-label':'ویرایش '+t.t},'ویرایش'),
      h('button',{class:'bt dl',type:'button','data-a':'deltask','data-id':t.id,'aria-label':'حذف '+t.t},'حذف')),
    t.d&&!t.review?h('div',{class:'nt'},t.d):null);
}
function render(){
  const V=tasks.filter(match);
  const cs=s=>tasks.filter(t=>t.s===s).length;
  $('stats').replaceChildren(...[['کل',tasks.length],['نمایش‌داده‌شده',V.length],['انجام‌نشده',cs('todo')],['ناقص',cs('partial')],['انجام‌شده',cs('done')],['مطالعه‌شده',cs('studied')],['مرور',tasks.filter(t=>t.review).length]].map(([l,n])=>h('span',{class:'chip'},l+': '+fa(n))));
  $('flt').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f===filter)));
  tree.replaceChildren();
  if(!V.length)tree.append(h('p',{class:'empty'},filter==='all'?'هیچ وظیفه‌ای وجود ندارد.':'هیچ وظیفه‌ای با این فیلتر یافت نشد.'));
  BR.forEach((c,i)=>{
    const A=tasks.filter(t=>t.c===c),Vc=A.filter(match);
    if(filter!=='all'&&!Vc.length)return;
    const sec=h('section',{class:'br b'+i});
    sec.append(folder([c],c,A.length,Vc.length,0,()=>{
      if(!A.length)return h('p',{class:'em'},'این شاخه خالی است.');
      return [...grp(A,k1)].map(([x,a])=>{
        const v=a.filter(match);if(!v.length)return null;
        return folder([c,x],x,a.length,v.length,1,()=>[...grp(a,k2)].map(([y,a2])=>{
          const v2=a2.filter(match);if(!v2.length)return null;
          return folder([c,x,y],y,a2.length,v2.length,2,()=>v2.map(taskRow));
        }));
      });
    }));
    tree.append(sec);
  });
}

function descr(p){
  const [c,x,y]=p,o=c===ORG;
  if(p.length===1)return `شاخه «${c}»`;
  if(p.length===2)return `${o?'منبع':'مبحث'} «${x}» از شاخه «${c}»`;
  return `${o?'مبحث':'منبع'} «${y}» در ${o?'منبع':'مبحث'} «${x}» از شاخه «${c}»`;
}
function ask(q){
  pend=q;
  if(q.id!=null){
    const t=tasks.find(x=>x.id===q.id);if(!t){pend=null;return}
    $('mp').textContent=`وظیفه «${t.t}» حذف خواهد شد. این کار قابل بازگشت نیست.`;
  }else{
    const n=tasks.filter(t=>inPath(t,q.p)).length;
    $('mp').textContent=`${descr(q.p)} و ${fa(n)} وظیفه‌ی زیرمجموعه‌ی آن حذف خواهد شد. این کار قابل بازگشت نیست.`;
  }
  lastFocus=document.activeElement;$('mdl').hidden=false;$('mc').focus();
}
function closeM(){pend=null;$('mdl').hidden=true;if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
$('mc').onclick=closeM;
$('mdl').onclick=e=>{if(e.target===$('mdl'))closeM()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('mdl').hidden)closeM()});
$('mo').onclick=()=>{
  const q=pend;if(!q)return;
  tasks=q.id!=null?tasks.filter(t=>t.id!==q.id):tasks.filter(t=>!inPath(t,q.p));
  if(editing!=null&&!tasks.some(t=>t.id===editing))editing=null;
  closeM();render();save();msg('حذف انجام شد.');
};

tree.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||!tree.contains(b))return;
  const a=b.dataset.a,k=b.dataset.k,id=Number(b.dataset.id);
  if(a==='toggle'){
    open.has(k)?open.delete(k):open.add(k);render();
    const n=[...tree.querySelectorAll('.tg')].find(x=>x.dataset.k===k);if(n)n.focus();
  }else if(a==='del')ask({p:JSON.parse(k)});
  else if(a==='deltask')ask({id});
  else if(a==='edit'){editing=id;render();const i=tree.querySelector('.ef input');if(i)i.focus()}
  else if(a==='cancel'){editing=null;render()}
});
tree.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target;if(f.dataset.f!=='edit')return;
  const t=tasks.find(x=>x.id===Number(f.dataset.id));if(!t)return;
  const E=f.elements,title=E.t.value.trim(),s=E.s.value;
  if(!title)return msg('عنوان نباید خالی باشد.',1);
  if(!stOK(t,s))return msg('وضعیت انتخاب‌شده برای این مورد مجاز نیست.',1);
  t.t=title;t.s=s;if(!t.review)t.d=E.d.value.trim();
  editing=null;render();save();msg('تغییرات ذخیره شد.');
});

$('flt').append(...FL.map(([v,l])=>h('button',{class:'bt',type:'button','data-f':v},l)));
$('flt').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;render()}});
$('ea').onclick=()=>{BR.forEach(c=>open.add(JSON.stringify([c])));tasks.forEach(t=>pathKeys(t).forEach(k=>open.add(k)));render()};
$('ca').onclick=()=>{open.clear();render()};

$('cp').onclick=async()=>{
  const x=JSON.stringify(tasks,null,2);
  try{
    if(!navigator.clipboard)throw 0;
    await navigator.clipboard.writeText(x);
  }catch(_){
    const a=h('textarea',{readonly:true,style:'position:fixed;top:0;opacity:0'});
    a.value=x;document.body.append(a);a.select();
    let r=false;try{r=document.execCommand('copy')}catch(__){}
    a.remove();
    if(!r)return msg('کپی انجام نشد. لطفاً دوباره تلاش کنید.',1);
  }
  msg('اطلاعات با موفقیت کپی شد.');
};

$('ghconnect').onclick=()=>{
  const value=$('ghtoken').value.trim();
  if(!value)return msg('ابتدا GitHub Token را وارد کن.',1);
  ghToken=value;
  $('ghtoken').value='';
  $('ghstate').textContent='توکن فقط در حافظه این صفحه نگهداری می‌شود.';
  save();
};
$('wkc').addEventListener('change',e=>{
  weekly=e.target.checked;
  save();
});

$('dl').onclick=()=>{
  try{
    const rows=tasks.map(t=>'  '+JSON.stringify([t.id,t.c,t.m,t.b,t.t,t.s,t.d,t.review]).replace(/</g,'\\u003c')).join(',\n');
    const a0=pristine.indexOf('const sourceRows = ['),z=pristine.indexOf('\n];',a0);
    if(a0<0||z<0)throw new Error('dataset block not found');
    const html=pristine.slice(0,a0)+'const sourceRows = [\n'+rows+'\n];'+pristine.slice(z+3);
    const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
    const a=h('a',{href:url,download:'CAPP-'+new Date().toISOString().slice(0,10)+'.html'});
    document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    msg('نسخه‌ی HTML با داده‌های فعلی دانلود شد؛ این فایل خروجی مستقل است.');
  }catch(e){msg('ساخت نسخه‌ی جدید ممکن نبود.',1)}
};

const af=$('addForm');
function syncKind(){
  const rv=af.elements.kind.value==='review';
  af.querySelectorAll('.onlyt').forEach(e=>{e.hidden=rv});
  $('tlab').textContent=rv?'عنوان مرور':'عنوان وظیفه';
  af.elements.s.replaceChildren(...(rv?['todo','done']:Object.keys(SL)).map(v=>h('option',{value:v},SL[v])));
}
af.elements.c.replaceChildren(...BR.map(c=>h('option',{value:c},c)));
af.addEventListener('change',e=>{if(e.target.name==='kind')syncKind()});
af.addEventListener('submit',e=>{
  e.preventDefault();
  const E=af.elements,rv=E.kind.value==='review';
  const m=E.m.value.trim(),b=rv?RB:E.b.value.trim(),t=E.t.value.trim();
  if(!m)return msg('لطفاً مبحث را وارد کنید.',1);
  if(!b)return msg('لطفاً کتاب / منبع را وارد کنید.',1);
  if(!t)return msg(rv?'لطفاً عنوان مرور را وارد کنید.':'لطفاً عنوان وظیفه را وارد کنید.',1);
  const n={id:Math.max(0,...tasks.map(x=>x.id))+1,c:E.c.value,m,b,t,s:E.s.value,d:rv?'':E.d.value.trim(),review:rv};
  if(!ok(n))return msg('اطلاعات واردشده معتبر نیست.',1);
  tasks.push(n);pathKeys(n).forEach(k=>open.add(k));
  if(!match(n))filter='all';
  editing=null;E.m.value='';E.t.value='';E.b.value='';E.d.value='';
  render();save();msg('مورد جدید اضافه شد.');
});
syncKind();
(async()=>{
  try{
    await loadFromGitHub();
    serverReady=true;
    $('wkc').checked=weekly;
    $('ghstate').textContent=serverHasData?'اطلاعات از GitHub بارگذاری شد':'فایل داده هنوز ساخته نشده؛ اولین ذخیره آن را ایجاد می‌کند.';
    render();
    msg(serverHasData?'اطلاعات از GitHub بارگذاری شد.':'Repository آماده است؛ برای اولین ذخیره توکن GitHub را وارد کن.');
  }catch(e){
    serverReady=false;
    $('ghstate').textContent='خطا در دریافت اطلاعات از GitHub';
    render();
    msg('دریافت اطلاعات از GitHub ناموفق بود: '+(e.message||''),1);
  }
})();
})();
</script></body></html>
