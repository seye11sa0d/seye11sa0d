<!DOCTYPE html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ورود</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--bg:#f3f5f9;--card:#fff;--fg:#1e293b;--mut:#64748b;--line:#d9e0ea;--acc:#1e3a8a;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#151b24;--fg:#e6edf5;--mut:#93a1b3;--line:#2c3644;--acc:#3b5fc4}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.6 Vazirmatn,Tahoma,"Segoe UI",sans-serif}
button,input{font:inherit}
:focus-visible{outline:2px solid #2563eb;outline-offset:2px}

/* gate */
#f{position:fixed;inset:0;margin:auto;height:fit-content;width:calc(100% - 32px);max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
h1{font-size:1.1rem;margin:0 0 14px}
#f input,#f button{width:100%;padding:10px 12px;border-radius:8px}
#f input{border:1px solid var(--line);background:var(--bg);color:var(--fg);direction:ltr;text-align:left;margin-bottom:10px}
#f button{border:0;background:var(--acc);color:#fff;cursor:pointer}
#f button:disabled{opacity:.6;cursor:wait}
#e{min-height:1.6em;margin:8px 0 0;color:#b91c1c;font-size:.9rem}

/* lobby */
#lobby{min-height:100%;display:grid;place-content:center;gap:18px;padding:20px;text-align:center}
#lobby h2{margin:0;font-size:1.3rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;width:min(520px,calc(100vw - 40px))}
.card{display:block;padding:26px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--fg);cursor:pointer;font-size:1.15rem;font-weight:700}
.card small{display:block;margin-top:4px;color:var(--mut);font-weight:400;font-size:.85rem}
.card:hover{border-color:var(--acc)}

/* viewer */
#viewer{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#bar{display:flex;align-items:center;gap:12px;height:46px;padding:0 10px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
#back{min-height:34px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
#back:hover{border-color:var(--acc)}
#vt{font-weight:700}
#fr{flex:1;width:100%;border:0;background:transparent}
</style></head><body>

<form id="f">
<h1>رمز عبور را وارد کنید</h1>
<input id="p" type="password" name="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="رمز عبور" required autofocus>
<button id="b" type="submit">ورود</button>
<p id="e" role="alert"></p>
</form>

<main id="lobby" hidden>
<h2>یک بخش را انتخاب کنید</h2>
<div class="cards">
<button class="card" type="button" data-k="capp">CAPP<small>بخش اول</small></button>
<button class="card" type="button" data-k="orb">Orbitals<small>اوربیتال‌های هیدروژن</small></button>
</div>
</main>

<div id="viewer" hidden>
<div id="bar"><button id="back" type="button">→ بازگشت به لابی</button><span id="vt"></span></div>
<iframe id="fr" title="بخش انتخاب‌شده"></iframe>
</div>

const TITLES={capp:'CAPP',orb:'Orbitals'};
const n=s=>s.replace(/[\u0660-\u0669]/g,c=>c.charCodeAt(0)-1632).replace(/[\u06f0-\u06f9]/g,c=>c.charCodeAt(0)-1776).toLowerCase().replace(/[^a-z0-9]/g,'');
const $=id=>document.getElementById(id);
const f=$('f'),p=$('p'),b=$('b'),e=$('e'),lobby=$('lobby'),viewer=$('viewer'),fr=$('fr');
let HTML=null;
async function dec(pw,s){
  const d=Uint8Array.from(atob(s),c=>c.charCodeAt(0)),salt=d.slice(0,16),iv=d.slice(16,28),ct=d.slice(28);
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:IT,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct));
}
function showLobby(){fr.srcdoc='';viewer.hidden=true;lobby.hidden=false;document.title='لابی'}
function open(k){fr.srcdoc=HTML[k];$('vt').textContent=TITLES[k];document.title=TITLES[k];lobby.hidden=true;viewer.hidden=false}
fr.addEventListener('load',()=>{try{fr.contentWindow.focus()}catch(_){}});
f.addEventListener('submit',async ev=>{
  ev.preventDefault();
  if(!(window.crypto&&crypto.subtle)){e.textContent='این صفحه باید با آدرس https (مثل github.io) باز شود، نه از داخل فایل\u200cهای گوشی.';return}
  b.disabled=true;e.style.color='#475569';e.textContent='در حال بررسی…';
  try{
    const pw=n(p.value);
    const r=await Promise.all([dec(pw,D.capp),dec(pw,D.orb)]);
    HTML={capp:r[0],orb:r[1]};
  }catch(_){e.style.color='';e.textContent='رمز اشتباه است.';b.disabled=false;p.select();return}
  p.value='';f.hidden=true;showLobby();
});
lobby.addEventListener('click',ev=>{const c=ev.target.closest('[data-k]');if(c&&HTML)open(c.dataset.k)});

})();
