<title>Seye11sa0d official website</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--bg:#f3f5f9;--card:#fff;--fg:#1e293b;--mut:#64748b;--line:#d9e0ea;--acc:#1e3a8a;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#151b24;--fg:#e6edf5;--mut:#93a1b3;--line:#2c3644;--acc:#3b5fc4}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.6 Vazirmatn,Tahoma,"Segoe UI",sans-serif}
button,input{font:inherit}
:focus-visible{outline:2px solid #7da2ff;outline-offset:3px}

/* ===== animated background (splash + gate) ===== */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#111c4a 0%,#070b1a 55%,#04060f 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;mix-blend-mode:screen;will-change:transform;animation:drift 20s ease-in-out infinite alternate}
.b1{width:48vmax;height:48vmax;background:#3347ff;left:-14vmax;top:-16vmax}
.b2{width:44vmax;height:44vmax;background:#00bcd4;right:-16vmax;bottom:-18vmax;animation-duration:25s;animation-delay:-8s}
.b3{width:34vmax;height:34vmax;background:#9b4dff;left:34%;top:42%;opacity:.38;animation-duration:30s;animation-delay:-14s}
@keyframes drift{to{transform:translate3d(9vmax,7vmax,0) scale(1.18)}}
#bgc{position:absolute;inset:0;width:100%;height:100%}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(2,4,12,.65) 100%);pointer-events:none}

/* ===== splash ===== */
#splash{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;direction:ltr;color:#fff;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;transition:opacity .45s ease,transform .45s ease,filter .45s ease}
#splash.out{opacity:0;transform:scale(1.05);filter:blur(8px);pointer-events:none}
.rings{position:absolute;left:50%;top:50%;width:min(86vmin,700px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none}
.rings i{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(150,175,255,.2);animation:spin 44s linear infinite}
.rings i:nth-child(2){inset:13%;border-style:dashed;border-color:rgba(150,175,255,.16);animation-duration:64s;animation-direction:reverse}
.rings i:nth-child(3){inset:27%;border-color:rgba(125,249,255,.2);animation-duration:34s}
.rings i::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#7df9ff;box-shadow:0 0 14px 3px rgba(125,249,255,.85)}
.rings i:nth-child(2)::after{background:#b48bff;box-shadow:0 0 14px 3px rgba(180,139,255,.85)}
.rings i:nth-child(3)::after{background:#6f9bff;box-shadow:0 0 14px 3px rgba(111,155,255,.85)}
@keyframes spin{to{transform:rotate(360deg)}}

.hero{position:relative;display:flex;flex-direction:column;align-items:center;gap:30px;animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.hero h1{margin:0;line-height:1.08}
.t1{display:block;font-size:clamp(2.3rem,10.5vw,5.2rem);font-weight:800;letter-spacing:.02em;
 background:linear-gradient(100deg,#ffffff 15%,#9db9ff 38%,#7df9ff 50%,#c7a6ff 62%,#ffffff 85%);background-size:260% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
 filter:drop-shadow(0 0 22px rgba(110,140,255,.5));
 animation:reveal 1.5s cubic-bezier(.2,.8,.2,1) both,shine 7s linear 1.5s infinite}
@keyframes reveal{from{opacity:0;letter-spacing:.35em;filter:blur(14px) drop-shadow(0 0 0 transparent)}to{opacity:1;letter-spacing:.02em}}
@keyframes shine{to{background-position:-260% 0}}
.t2{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px;font-size:clamp(.78rem,3.3vw,1.1rem);letter-spacing:.42em;text-transform:uppercase;color:#aebcf0;animation:fadeup .9s .7s both}
.t2 b{display:block;height:1px;width:clamp(28px,9vw,80px);background:linear-gradient(90deg,transparent,#8fb0ff);transform-origin:right;animation:grow 1s 1s both}
.t2 b:last-child{background:linear-gradient(270deg,transparent,#8fb0ff);transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

#enter{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;gap:12px;padding:15px 44px;border:0;border-radius:999px;background:transparent;color:#fff;font-size:1.05rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;animation:fadeup .9s 1.1s both,pulse 2.8s 2.2s ease-out infinite;transition:transform .25s ease,box-shadow .25s ease}
#enter::before{content:"";position:absolute;z-index:-2;left:50%;top:50%;width:max(340px,230%);aspect-ratio:1;background:conic-gradient(#3b82f6,#22d3ee,#a855f7,#ec4899,#3b82f6);animation:spinc 3.6s linear infinite}
#enter::after{content:"";position:absolute;z-index:-1;inset:2px;border-radius:inherit;background:#0a1030;transition:background .25s ease}
#enter:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 0 34px rgba(90,140,255,.55)}
#enter:hover::after{background:#101a4a}
#enter:active{transform:scale(.97)}
#enter .arr{display:inline-block;transition:transform .3s ease}
#enter:hover .arr{transform:translateX(6px)}
@keyframes spinc{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(90,140,255,.5)}80%,100%{box-shadow:0 0 0 24px rgba(90,140,255,0)}}

/* ===== gate (glass card over the animated background) ===== */
#f{position:fixed;inset:0;z-index:1;margin:auto;height:fit-content;width:calc(100% - 32px);max-width:350px;padding:24px;border-radius:18px;direction:ltr;text-align:left;color:#e8eeff;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
 background:rgba(12,18,44,.6);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(150,175,255,.25);box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
#f.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
#f h2{font-size:1.15rem;margin:0 0 16px;font-weight:600}
#f input,#f button{width:100%;padding:12px 14px;border-radius:10px}
#f input{margin-bottom:12px;border:1px solid rgba(150,175,255,.3);background:rgba(255,255,255,.07);color:#fff;transition:border-color .2s,box-shadow .2s}
#f input:focus{outline:0;border-color:#7da2ff;box-shadow:0 0 0 3px rgba(90,130,255,.28)}
#b{border:0;background:linear-gradient(90deg,#3b82f6,#7c5cff);color:#fff;font-weight:600;letter-spacing:.06em;cursor:pointer;transition:filter .2s,transform .2s}
#b:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
#b:disabled,#f input:disabled{opacity:.55;cursor:not-allowed}
#e{min-height:1.6em;margin:10px 0 0;color:#ff9a9a;font-size:.92rem}
#t{margin:6px 0 0;font-size:1.6rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;color:#7df9ff;text-shadow:0 0 18px rgba(125,249,255,.5)}

/* ===== home ===== */
#lobby{min-height:100%;display:grid;place-content:center;gap:18px;padding:20px;text-align:center}
#lobby h2{margin:0;font-size:1.3rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;width:min(520px,calc(100vw - 40px))}
.card{display:block;padding:26px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--fg);cursor:pointer;font-size:1.15rem;font-weight:700}
.card small{display:block;margin-top:4px;color:var(--mut);font-weight:400;font-size:.85rem}
.card:hover{border-color:var(--acc)}

/* ===== viewer ===== */
#viewer{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#bar{display:flex;align-items:center;gap:12px;height:46px;padding:0 10px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
#back{min-height:34px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
#back:hover{border-color:var(--acc)}
#vt{font-weight:700}
#fr{flex:1;width:100%;border:0;background:transparent}

@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
}

const MAXT=5,LOCK=30*60*1000,KEY='gate_state_v2';
const TITLES={capp:'CAPP',orb:'Orbitals'};
const n=s=>s.trim();
const $=id=>document.getElementById(id);
const splash=$('splash'),f=$('f'),p=$('p'),b=$('b'),e=$('e'),t=$('t'),lobby=$('lobby'),viewer=$('viewer'),fr=$('fr');
let HTML=null,timer=null;

/* attempt counter + lockout (persisted so a reload does not reset it) */
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')return{fails:+s.fails||0,until:+s.until||0}}catch(_){}return{fails:0,until:0}}
let st=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(_){}}
const locked=()=>st.until>Date.now();
function stopLock(){clearInterval(timer);timer=null;t.hidden=true;p.disabled=false;b.disabled=false}
function tick(){
  const left=st.until-Date.now();
  if(left<=0){st={fails:0,until:0};save();stopLock();e.textContent='';p.focus();return}
  const s=Math.ceil(left/1000);t.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startLock(){
  p.value='';p.disabled=true;b.disabled=true;t.hidden=false;
  e.style.color='';e.textContent='Too many wrong attempts. Login is disabled until the timer ends.';
  tick();clearInterval(timer);timer=setInterval(tick,1000)}

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unwrap(pw,s){
  const d=u8(s),k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d.slice(0,16),iterations:IT,hash:'SHA-512'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(16,28)},k,d.slice(28)));
}
async function content(K,s){
  const d=u8(s),k=await crypto.subtle.importKey('raw',K,'AES-GCM',false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12)},k,d.slice(12)));
}
function showHome(){bgStop();fr.srcdoc='';viewer.hidden=true;lobby.hidden=false;document.title='Home page'}
function open(k){fr.srcdoc=HTML[k];$('vt').textContent=TITLES[k];document.title=TITLES[k];lobby.hidden=true;viewer.hidden=false}
fr.addEventListener('load',()=>{try{fr.contentWindow.focus()}catch(_){}});

/* animated background: drifting glow + connected particles that react to the pointer */
const bgEl=$('bg'),cv=$('bgc'),cx=cv.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,pts=[],mx=-999,my=-999,raf=null;
function bgSize(){
  const d=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);cx.setTransform(d,0,0,d,0,0);
  const N=Math.round(Math.min(120,Math.max(35,W*H/13000)));
  pts=Array.from({length:N},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.5,ph:Math.random()*6.28}))}
function bgDraw(ts){
  cx.clearRect(0,0,W,H);
  if(!reduce)for(const q of pts){
    q.x+=q.vx;q.y+=q.vy;
    if(q.x<-10)q.x=W+10;else if(q.x>W+10)q.x=-10;
    if(q.y<-10)q.y=H+10;else if(q.y>H+10)q.y=-10;
    const dx=q.x-mx,dy=q.y-my,d2=dx*dx+dy*dy;
    if(d2<14400&&d2>1){const d=Math.sqrt(d2),k=(1-d/120)*.6;q.x+=dx/d*k;q.y+=dy/d*k}}
  cx.lineWidth=1;
  for(let i=0;i<pts.length;i++){
    const a=pts[i];
    for(let j=i+1;j<pts.length;j++){
      const c2=pts[j],dx=a.x-c2.x,dy=a.y-c2.y,d2=dx*dx+dy*dy;
      if(d2<16900){cx.strokeStyle='rgba(140,170,255,'+(.28*(1-d2/16900)).toFixed(3)+')';cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(c2.x,c2.y);cx.stroke()}}
    const mdx=a.x-mx,mdy=a.y-my,m2=mdx*mdx+mdy*mdy;
    if(m2<22500){cx.strokeStyle='rgba(125,249,255,'+(.5*(1-m2/22500)).toFixed(3)+')';cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(mx,my);cx.stroke()}}
  const tm=(ts||0)/1000;
  for(const q of pts){cx.fillStyle='rgba(200,220,255,'+(reduce?.8:.55+.45*Math.sin(tm*1.6+q.ph)).toFixed(2)+')';cx.beginPath();cx.arc(q.x,q.y,q.r,0,6.283);cx.fill()}}
function bgLoop(ts){raf=requestAnimationFrame(bgLoop);bgDraw(ts)}
function bgStart(){bgEl.hidden=false;bgSize();if(reduce)bgDraw(0);else if(!raf)raf=requestAnimationFrame(bgLoop)}
function bgStop(){if(raf)cancelAnimationFrame(raf);raf=null;bgEl.hidden=true}
window.addEventListener('pointermove',ev=>{mx=ev.clientX;my=ev.clientY},{passive:true});
window.addEventListener('pointerleave',()=>{mx=my=-999});
window.addEventListener('pointerup',ev=>{if(ev.pointerType==='touch')mx=my=-999});
window.addEventListener('resize',()=>{if(!bgEl.hidden){bgSize();if(reduce)bgDraw(0)}});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=null}
  else if(!bgEl.hidden&&!reduce&&!raf)raf=requestAnimationFrame(bgLoop)});
bgStart();

$('enter').addEventListener('click',()=>{
  splash.classList.add('out');
  setTimeout(()=>{splash.hidden=true;f.hidden=false;if(locked())startLock();else p.focus()},reduce?0:450)},{once:true});

f.addEventListener('submit',async ev=>{
  ev.preventDefault();
  if(locked()){startLock();return}
  if(st.until){st={fails:0,until:0};save()}
  if(!(window.crypto&&crypto.subtle)){e.textContent='This page must be opened over https (for example on github.io), not from a local file.';return}
  b.disabled=true;e.style.color='#9db4ff';e.textContent='Checking…';
  try{
    const pw=n(p.value);
    const K=(await Promise.all(D.k.map(w=>unwrap(pw,w).catch(()=>null)))).find(Boolean);
    if(!K)throw new Error('bad');
    const r=await Promise.all([content(K,D.capp),content(K,D.orb)]);
    HTML={capp:r[0],orb:r[1]};
  }catch(_){
    st.fails++;
    f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');
    if(st.fails>=MAXT){st.until=Date.now()+LOCK;save();startLock();return}
    save();e.style.color='';e.textContent='Wrong password. '+(MAXT-st.fails)+' attempt'+(MAXT-st.fails===1?'':'s')+' left.';b.disabled=false;p.select();return}
  st={fails:0,until:0};save();
  p.value='';f.hidden=true;showHome();
});
lobby.addEventListener('click',ev=>{const c=ev.target.closest('[data-k]');if(c&&HTML)open(c.dataset.k)});
$('back').addEventListener('click',showHome);
})();
</script>
